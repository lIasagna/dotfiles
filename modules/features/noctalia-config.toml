    [theme.templates]
    builtin_ids = [ "gtk3", "gtk4", "ghostty", "kcolorscheme", "niri", "qt" ]
    community_ids = [ "zen-browser", "neovim", "obsidian", "steam", "yazi" ]

[wallpaper]
